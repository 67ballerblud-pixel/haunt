name: Haunt
version: 1.0
main: me.fix.haunt.HauntPlugin
api-version: "1.21"
folia-supported: true
author: DILLYY_MC
description: /haunt - haunt a player with fake players, jumpscares and creepy ambience (only they can see it).

commands:
  haunt:
    description: Haunt a player
    usage: /haunt <player> [duration] [intensity 1-3] | stop <player|all> | list | scare <player> <type> | optout | reload
    permission: haunt.use

permissions:
  haunt.use:
    description: Use /haunt
    default: op
  haunt.bypass:
    description: Can't be haunted
    default: false
  haunt.optout:
    description: Use /haunt optout to opt out of being haunted
    default: true
